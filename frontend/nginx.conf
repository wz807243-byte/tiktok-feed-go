# Docker DNS refresh lets the backend container be recreated independently.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream backend_api {
    zone backend_api 64k;
    server backend:8080 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend accepts a 200 MiB video; allow multipart overhead as well.
    client_max_body_size 220m;
    client_body_timeout 600s;
    proxy_connect_timeout 10s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        return 308 /api/;
    }

    # Trailing slash strips /api/ before forwarding to the Go API.
    location ^~ /api/ {
        proxy_pass http://backend_api/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
    }

    # Keep /static/ and range requests for seeking through uploaded videos.
    location ^~ /static/ {
        proxy_pass http://backend_api;
        # Range and If-Range are passed through by default.
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
